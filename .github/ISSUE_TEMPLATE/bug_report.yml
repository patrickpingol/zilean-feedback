name: Bug report
description: Something in Zilean isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please search existing issues first. Don't paste secrets, tokens or connection strings.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a job with …
        2. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Scheduling, HTTP jobs, Script jobs, Workflows, Admin UI, API, MCP, Users & auth, Monitoring, Deployment, Other]
  - type: input
    id: version
    attributes:
      label: Zilean version
      description: Shown in the admin UI sidebar, or from GET /api/meta.
      placeholder: e.g. v4.0.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Zilean?
      options: [Docker, Binary, AWS, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or job output
      description: Pasted as code; remove anything sensitive.
      render: shell
